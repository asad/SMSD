name: Prepare release artefacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  java-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test CLI JAR
        run: mvn -U -B clean verify
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: java-jars
          path: |
            java/target/smsd-*.jar
            !java/target/smsd-*-sources.jar
            !java/target/smsd-*-javadoc.jar
            !java/target/original-*.jar
          if-no-files-found: error

  cpp-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Test and package C++ headers
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cmake -S cpp -B build/headers -DCMAKE_BUILD_TYPE=Debug \
            -DSMSD_BUILD_PYTHON=OFF -DSMSD_BUILD_TESTS=ON \
            -DSMSD_BUILD_METAL=OFF -DSMSD_BUILD_CUDA=OFF
          cmake --build build/headers --parallel 2
          ctest --test-dir build/headers --output-on-failure
          VERSION=${RELEASE_TAG#v}
          COPYFILE_DISABLE=1 tar -czf "smsd-cpp-${VERSION}-headers.tar.gz" \
            LICENSE NOTICE -C cpp/include smsd/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: cpp-headers
          path: smsd-cpp-*-headers.tar.gz
          if-no-files-found: error

  docker-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Build CLI image
        run: docker build --tag smsd:release-check .
      - name: Test CLI image
        run: docker run --rm smsd:release-check --help
      - name: Save tested image
        run: docker save smsd:release-check | gzip > smsd-cli-image.tar.gz
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: docker-cli
          path: smsd-cli-image.tar.gz
          if-no-files-found: error
