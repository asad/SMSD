name: Prepare release artefacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and validate
        required: true
        type: string

# Each job states the token permissions it needs.
permissions: {}

jobs:
  java-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test the library and CLI JARs
        run: mvn -U -B clean verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-jars
          path: |
            java/core/target/smsd-*.jar
            !java/core/target/smsd-*-sources.jar
            !java/core/target/smsd-*-javadoc.jar
            !java/core/target/smsd-*-tests.jar
            java/cli/target/smsd-cli-*-jar-with-dependencies.jar
          if-no-files-found: error

  cpp-headers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Test and package C++ headers
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cmake -S cpp -B build/headers -DCMAKE_BUILD_TYPE=Debug \
            -DSMSD_BUILD_PYTHON=OFF -DSMSD_BUILD_TESTS=ON \
            -DSMSD_BUILD_METAL=OFF -DSMSD_BUILD_CUDA=OFF
          cmake --build build/headers --parallel 2
          ctest --test-dir build/headers --output-on-failure
          VERSION=${RELEASE_TAG#v}
          COPYFILE_DISABLE=1 tar -czf "smsd-cpp-${VERSION}-headers.tar.gz" \
            LICENSE NOTICE -C cpp/include smsd/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cpp-headers
          path: smsd-cpp-*-headers.tar.gz
          if-no-files-found: error

  docker-cli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Build CLI image
        run: docker build --tag smsd:release-check .
      - name: Test CLI image
        run: docker run --rm smsd:release-check --help
      - name: Save tested image
        run: docker save smsd:release-check | gzip > smsd-cli-image.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-cli
          path: smsd-cli-image.tar.gz
          if-no-files-found: error
