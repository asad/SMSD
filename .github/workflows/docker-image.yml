name: Docker Image CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build Docker image
        run: docker build . --file Dockerfile --tag smsd:ci-${{ github.sha }}
      - name: Smoke test
        run: docker run --rm smsd:ci-${{ github.sha }} --help
