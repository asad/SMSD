name: Native Windows release packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft or published release containing the validated JAR and source archive
        required: true
        type: string
      build_python_wheel:
        description: Also build and test the Windows Python wheel from the same release source
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  windows:
    name: Windows AMD64 MSI and optional CPython 3.14 wheel
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      # Packaging helpers come from the selected workflow branch. Payloads
      # come from the named release and are checked against its SHA256SUMS.
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Download and verify release inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v([0-9]+\.[0-9]+\.[0-9]+)$') {
            throw 'Expected an existing stable release tag, such as v7.2.2'
          }
          $version = $Matches[1]
          New-Item -ItemType Directory -Path release-input -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:RELEASE_REPOSITORY --dir release-input `
            --pattern "smsd-$version-jar-with-dependencies.jar" --pattern "smsd-$version.tar.gz" `
            --pattern SOURCE_MANIFEST.json --pattern SHA256SUMS
          if ($LASTEXITCODE -ne 0) { throw 'Release input download failed' }
          $check = @'
          from pathlib import Path, PurePosixPath
          import hashlib
          import json
          import re
          import subprocess
          import sys
          import tarfile

          sys.path.insert(0, str(Path('scripts').resolve()))
          from build_java_installer import require, release_inputs
          from build_python_wheels import inspect_source

          def git(*arguments):
              return subprocess.check_output(['git', *arguments], text=True, encoding='utf-8').strip()

          version, tag = sys.argv[1:]
          directory = Path('release-input')
          names = {f'smsd-{version}-jar-with-dependencies.jar', f'smsd-{version}.tar.gz', 'SOURCE_MANIFEST.json'}
          require({path.name for path in directory.iterdir()} == names | {'SHA256SUMS'},
                  'Release input filenames differ from the selected version')
          sums = {}
          for line in (directory / 'SHA256SUMS').read_text(encoding='utf-8').splitlines():
              row = re.fullmatch(r'([0-9a-f]{64}) [ *](.+)', line)
              require(row is not None and row[2] not in sums, 'Malformed or duplicate release checksum')
              sums[row[2]] = row[1]
          require(all(sums.get(name) == hashlib.sha256((directory / name).read_bytes()).hexdigest()
                      for name in names), 'Release input checksum differs')
          require(release_inputs(directory)['version'] == version, 'CLI JAR release version differs')
          manifest = json.loads((directory / 'SOURCE_MANIFEST.json').read_text(encoding='utf-8'))
          require(manifest.get('working_tree_clean') is True, 'Source freeze must have a clean checkout')
          source = inspect_source(directory / f'smsd-{version}.tar.gz')
          for field in ('version', 'sdist', 'sdist_sha256', 'source_file_count'):
              require(manifest.get(field) == source[field], 'Source manifest identity differs: ' + field)
          require(source['version'] == version, 'SDK metadata differs from the selected release')
          for field in ('release_ref', 'source_commit'):
              require(isinstance(manifest.get(field), str)
                      and re.fullmatch(r'[0-9a-f]{40}', manifest[field]) is not None,
                      'Expected a full frozen Git identity: ' + field)

          fetch = ['fetch', '--no-tags', '--filter=blob:none']
          if git('rev-parse', '--is-shallow-repository') == 'true':
              fetch.append('--unshallow')
          subprocess.run(['git', *fetch, 'origin', manifest['release_ref'],
                          f'refs/tags/{tag}:refs/tags/{tag}'], check=True)
          frozen = git('rev-parse', '--verify', manifest['release_ref'] + '^{commit}')
          require(frozen == manifest['source_commit'], 'Frozen source ref resolves to another commit')
          tagged = git('rev-parse', '--verify', f'refs/tags/{tag}' + '^{commit}')
          subprocess.run(['git', 'merge-base', '--is-ancestor', frozen, tagged], check=True)
          # Validation notes can advance after the frozen SDK. Production files cannot.
          changed = git('diff', '--name-only', frozen, tagged).splitlines()
          require(all(Path(name).suffix in ('.md', '.rst') or name == 'CITATION.cff' for name in changed),
                  'Tagged production files differ from the frozen SDK source')
          tree = subprocess.check_output(['git', 'ls-tree', '-r', '-z', '--full-tree', frozen])
          blobs = {}
          for entry in tree.split(b'\0'):
              if entry:
                  metadata, name = entry.split(b'\t', 1)
                  mode, kind, identity = metadata.split()
                  if kind == b'blob' and mode in (b'100644', b'100755'):
                      blobs[name.decode('utf-8')] = identity.decode('ascii')
          with tarfile.open(directory / source['sdist'], 'r:gz') as archive:
              for member in archive.getmembers():
                  if not member.isfile():
                      continue
                  relative = PurePosixPath(*PurePosixPath(member.name).parts[1:]).as_posix()
                  if relative == 'PKG-INFO':
                      continue
                  content = archive.extractfile(member).read()
                  identity = hashlib.sha1(b'blob ' + str(len(content)).encode('ascii') + b'\0' + content).hexdigest()
                  require(blobs.get(relative) == identity, 'SDK file differs from frozen source: ' + relative)
          print('Verified JAR, SDK, source manifest and frozen Git identity')
          '@
          $check | python - "$version" "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Release checksum verification failed' }
          "SMSD_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Download the pinned Temurin 25 JDK
        shell: pwsh
        run: |
          $url = 'https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_windows_hotspot_25.0.4.1_1.zip'
          $sha = '00c847d804f4a78e9f04f2683faf14fed898535b177b7fc704486cb0284e9283'
          $directory = Join-Path $env:RUNNER_TEMP 'smsd-jdk'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $archive = Join-Path $directory 'jdk.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha) {
            throw 'Temurin archive checksum differs'
          }
          Expand-Archive -Path $archive -DestinationPath $directory
          $jdks = @(Get-ChildItem $directory -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'bin\jpackage.exe') })
          if ($jdks.Count -ne 1) { throw 'Expected one extracted JDK' }
          "SMSD_JAVA_HOME=$($jdks[0].FullName)" >> $env:GITHUB_ENV
          "SMSD_JDK_URL=$url" >> $env:GITHUB_ENV
          "SMSD_JDK_SHA256=$sha" >> $env:GITHUB_ENV
      - name: Check WiX and create the console MSI
        shell: pwsh
        run: |
          $wix = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'
          if ($env:WIX) { $wix = Join-Path $env:WIX 'bin' }
          if (!(Test-Path (Join-Path $wix 'candle.exe')) -or !(Test-Path (Join-Path $wix 'light.exe'))) {
            throw 'The Windows runner must provide WiX 3.14'
          }
          $env:PATH = "$wix;$env:PATH"
          Get-Item (Join-Path $wix 'candle.exe') | Select-Object -ExpandProperty VersionInfo | Format-List ProductVersion
          python scripts/build_java_installer.py build --release-dir release-input --format msi `
            --output-dir installer-output --java-home $env:SMSD_JAVA_HOME `
            --jdk-archive-sha256 $env:SMSD_JDK_SHA256 --jdk-source-url $env:SMSD_JDK_URL
          if ($LASTEXITCODE -ne 0) { throw 'MSI build or application-image checks failed' }
      - name: Install, run and remove the MSI
        shell: pwsh
        run: |
          ./scripts/check_windows_installer.ps1 -ReleaseDir release-input -OutputDir installer-output
      - name: Build and test the Windows Python wheel
        if: ${{ inputs.build_python_wheel }}
        shell: pwsh
        run: |
          python -m pip install cibuildwheel==4.2.1
          if ($LASTEXITCODE -ne 0) { throw 'Wheel tooling installation failed' }
          python scripts/build_python_wheels.py build `
            --sdist "release-input/smsd-$env:SMSD_RELEASE_VERSION.tar.gz" `
            --source-manifest release-input/SOURCE_MANIFEST.json `
            --platform windows --arch AMD64 --output-dir wheelhouse
          if ($LASTEXITCODE -ne 0) { throw 'Windows wheel build or tests failed' }
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: java-installer-windows-amd64
          path: |
            installer-output/*.msi
            installer-output/installer-provenance.json
            installer-output/installation-check.json
            installer-output/installed-image-check.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ inputs.build_python_wheel }}
        with:
          name: python-wheel-windows-AMD64
          path: wheelhouse/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.1
        if: ${{ failure() }}
        with:
          name: windows-installer-diagnostics
          path: installer-output/*.log
          if-no-files-found: ignore
