name: maven

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Test release tooling
        run: |
          python -m pip install pytest pytest-timeout
          python -m pytest scripts/tests -q

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build Java 8-compatible packages and test on Java 25
        run: mvn -U -B -Dslow.tests.exclude=nothing -Dsurefire.reportNameSuffix=java25 clean verify
      - name: Set up Java 8 compatibility runtime
        uses: actions/setup-java@v6.0.1
        with:
          distribution: corretto
          java-version: '8'
          cache: maven
      - name: Test the same compiled classes on Java 8
        run: mvn -f java/pom.xml -B -Dslow.tests.exclude=nothing -Dsurefire.reportNameSuffix=java8 surefire:test
      - name: Upload fat JAR and launchers
        uses: actions/upload-artifact@v7.0.1
        with:
          name: smsd-jar-and-launchers
          path: |
            java/target/*-jar-with-dependencies.jar
            java/target/appassembler/
