name: maven

on:
  workflow_dispatch:

# Each job states the token permissions it needs.
permissions: {}

jobs:
  release-tooling:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Test release tooling
        run: |
          python -m pip install pytest==9.1.1 pytest-timeout==2.4.0
          python -m pytest scripts/tests -q

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Installing the library lets the Java 8 step below resolve it for the CLI tests.
      - name: Build Java 8-compatible packages and test on Java 25
        run: mvn -U -B -Dslow.tests.exclude=nothing -Dsurefire.reportNameSuffix=java25 clean install
      - name: Set up Java 8 compatibility runtime
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: corretto
          java-version: '8'
          cache: maven
      - name: Test the same compiled classes on Java 8
        run: mvn -f java/pom.xml -B -Dslow.tests.exclude=nothing -Dsurefire.reportNameSuffix=java8 surefire:test
      - name: Upload fat JAR and launchers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smsd-jar-and-launchers
          path: |
            java/cli/target/*-jar-with-dependencies.jar
            java/cli/target/appassembler/
