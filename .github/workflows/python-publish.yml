name: Publish Python Package to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing locally validated release tag
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build CPython 3.14 macOS arm64 wheel
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4.3.1
        with:
          ref: ${{ inputs.release_tag }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: .
        env:
          CIBW_ARCHS: "arm64"
          CIBW_BUILD: "cp314-macosx_arm64"
          CIBW_BEFORE_BUILD: "pip install pybind11 scikit-build-core cmake ninja"
          CIBW_BEFORE_ALL: "brew install libomp"
          CIBW_ENVIRONMENT: 'MACOSX_DEPLOYMENT_TARGET=26.0 CMAKE_ARGS="-DSMSD_BUILD_METAL=OFF -DSMSD_BUILD_CUDA=OFF"'
          CIBW_BUILD_VERBOSITY: "3"
          CIBW_TEST_COMMAND: >
            python -c "import smsd;
            print('SMSD', smsd.__version__, 'imported OK');
            m = smsd.parse_smiles('c1ccccc1');
            print('Benzene:', len(m), 'atoms')"

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: wheel-cp314-macos-arm64
          path: wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          ref: ${{ inputs.release_tag }}
      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
