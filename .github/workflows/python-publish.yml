name: Build and validate Python wheels

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact release commit or existing validated tag
        required: true
        type: string
      platform:
        description: Platform requiring validation; prefer local Linux/macOS builds
        required: true
        default: windows
        type: choice
        options: [windows, linux, macos, all]
      publish:
        description: Upload the validated published GitHub SDK and three wheels to PyPI (requires platform=all)
        required: true
        default: false
        type: boolean

# Each job states the token permissions it needs.
permissions: {}

jobs:
  source:
    if: ${{ !inputs.publish }}
    name: Prepare one source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Validate source ref and select explicit platforms
        id: matrix
        env:
          RELEASE_REF: ${{ inputs.release_tag }}
          BUILD_TARGET: ${{ inputs.platform }}
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          ref = os.environ['RELEASE_REF']
          if not re.fullmatch(r'(?:v\d+\.\d+\.\d+|[0-9a-fA-F]{40})', ref):
              raise SystemExit('Expected a stable release tag or exact 40-character commit SHA')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          resolved = subprocess.check_output(['git', 'rev-parse', ref + '^{commit}'], text=True).strip()
          if resolved != commit:
              raise SystemExit('Checkout does not match the requested release ref')
          target = os.environ['BUILD_TARGET']
          if os.environ['PUBLISH'] == 'true' and target != 'all':
              raise SystemExit('Publishing requires the complete matrix (platform=all)')
          entries = [
              {'platform': 'windows', 'os': 'windows-2022', 'arch': 'AMD64'},
              {'platform': 'linux', 'os': 'ubuntu-24.04', 'arch': 'x86_64'},
              {'platform': 'macos', 'os': 'macos-26', 'arch': 'arm64'},
          ]
          selected = [entry for entry in entries if target == 'all' or entry['platform'] == target]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('value=' + json.dumps({'include': selected}) + '\n')
          PY
      - name: Build and check source distribution
        env:
          RELEASE_REF: ${{ inputs.release_tag }}
        run: |
          python -m pip install build==1.6.1 twine==7.0.0 pytest==9.1.1 pytest-timeout==2.4.0
          python -m pytest scripts/tests -q
          python scripts/build_python_wheels.py prepare --output-dir dist --release-ref "$RELEASE_REF"
          python -m twine check --strict dist/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release-source
          path: dist/*
          if-no-files-found: error

  build:
    if: ${{ !inputs.publish }}
    name: CPython 3.14 ${{ matrix.platform }} ${{ matrix.arch }}
    needs: source
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-source
          path: release-source
      - name: Build, repair and test installed wheel from the sdist
        env:
          WHEEL_PLATFORM: ${{ matrix.platform }}
          WHEEL_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          python -m pip install cibuildwheel==4.2.1
          python scripts/build_python_wheels.py build \
            --sdist release-source/smsd-*.tar.gz --source-manifest release-source/SOURCE_MANIFEST.json \
            --platform "$WHEEL_PLATFORM" --arch "$WHEEL_ARCH" --output-dir wheelhouse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ matrix.platform }}-${{ matrix.arch }}
          path: wheelhouse/*
          if-no-files-found: error

  publish:
    name: Publish validated GitHub release files
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Download only the published release distributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_TARGET: ${{ inputs.platform }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/check_pypi_release.py download \
            --tag "$RELEASE_TAG" --platform "$BUILD_TARGET" --repository "$RELEASE_REPOSITORY" \
            --release-dir release-input --metadata-file release-metadata.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          path: release-checkout
          persist-credentials: false
      - name: Check release hashes, frozen source and all three wheels
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python scripts/check_pypi_release.py validate \
            --tag "$RELEASE_TAG" --release-dir release-input --metadata-file release-metadata.json \
            --source-checkout release-checkout --dist-dir dist --receipt-file upload-receipt.json
      - name: Verify the exact four files immediately before upload
        run: |
          python scripts/check_pypi_release.py verify-staged \
            --dist-dir dist --receipt-file upload-receipt.json
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
