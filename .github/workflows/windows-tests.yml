name: Windows tests

on:
  workflow_dispatch:

# Each job states the token permissions it needs.
permissions: {}

concurrency:
  group: windows-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      SMSD_DISABLE_GPU: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: C++ Release tests
        run: |
          cmake -S cpp -B build/release -DSMSD_BUILD_TESTS=ON -DSMSD_BUILD_METAL=OFF -DSMSD_BUILD_CUDA=OFF
          cmake --build build/release --config Release --parallel
          ctest --test-dir build/release -C Release --output-on-failure
      - name: C++ Debug tests
        run: |
          cmake -S cpp -B build/debug -DSMSD_BUILD_TESTS=ON -DSMSD_BUILD_METAL=OFF -DSMSD_BUILD_CUDA=OFF
          cmake --build build/debug --config Debug --parallel
          ctest --test-dir build/debug -C Debug --output-on-failure
      - name: Python wheel tests
        run: |
          python -m pip install ".[dev]" -Ccmake.define.SMSD_BUILD_METAL=OFF -Ccmake.define.SMSD_BUILD_CUDA=OFF
          Set-Location $env:RUNNER_TEMP
          python -m pytest "$env:GITHUB_WORKSPACE/python/tests" -q -p no:cacheprovider --import-mode=importlib
