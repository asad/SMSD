[build-system]
requires = ["scikit-build-core>=0.5,<2", "pybind11>=2.12,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "smsd"
version = "8.0.1"
description = "Substructure and MCS search, fingerprints and similarity screening for chemical graphs, with optional tautomer-aware matching"
readme = "python/README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Syed Asad Rahman", email = "asad.rahman@bioinceptionlabs.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
    "Natural Language :: English",
]
keywords = ["cheminformatics", "mcs", "maximum-common-substructure", "substructure", "graph-matching", "chemistry", "smiles", "smarts", "fingerprint", "ecfp", "maccs", "similarity", "screening", "tautomer"]

[project.optional-dependencies]
dev = ["pytest>=7.0,<10", "pytest-timeout>=2.0,<3"]
rdkit = ["rdkit<2027"]

[project.urls]
Homepage = "https://github.com/asad/SMSD"
Repository = "https://github.com/asad/SMSD"
Documentation = "https://github.com/asad/SMSD/blob/master/python/README.md"
Changelog = "https://github.com/asad/SMSD/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/asad/SMSD/issues"

[tool.scikit-build]
cmake.source-dir = "cpp"
cmake.build-type = "Release"
wheel.packages = ["python/smsd"]
wheel.license-files = ["LICENSE", "NOTICE", "licenses/libomp/LICENSE.TXT", "licenses/libgomp/COPYING3", "licenses/libgomp/COPYING.RUNTIME", "licenses/msvc/README.md", "licenses/msvc/LICENSE-2022.docx", "licenses/msvc/LICENSE-2026.docx"]
# Benchmark corpora and the Java and script test suites are left out of the sdist. The native
# release checks build cpp/tests from it; the tautomer atom-order test, which reads the
# benchmark corpus benchmarks/data/chembl_mcs_benchmark.smi, is skipped there. The Python
# tests in the sdist read the two shared golden fixtures and three benchmark modules.
sdist.exclude = ["benchmarks/**", "java/src/test/**", "java/cli/src/test/**", "scripts/tests/**"]
sdist.include = [
    "benchmarks/generate_dalke_pairs.py",
    "benchmarks/mcs_pairs.py",
    "benchmarks/mcs_protocol.py",
    "java/src/test/resources/com/bioinception/smsd/aromaticity_parity.json",
    "java/src/test/resources/com/bioinception/smsd/chemistry_rules.json",
]
minimum-version = "0.5"

[tool.scikit-build.cmake.define]
SMSD_BUILD_PYTHON = "ON"
SMSD_BUILD_TESTS = "OFF"
SMSD_BUILD_OPENMP = "ON"
SMSD_BUILD_METAL = "AUTO"
SMSD_BUILD_CUDA = "AUTO"

[tool.pytest.ini_options]
testpaths = ["python/tests", "scripts/tests"]
timeout = 60
addopts = "--import-mode=importlib"
