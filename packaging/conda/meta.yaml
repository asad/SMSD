{% set version = smsd_version %}

package:
  name: smsd
  version: {{ version }}

source:
  url: {{ smsd_source_url | string | tojson }}
  sha256: "{{ smsd_source_sha256 }}"

build:
  number: 0
  skip: true  # [py<312 or not (linux64 or (linux and aarch64) or osx or win64)]
  script: '"{{ PYTHON }}" "{{ RECIPE_DIR }}/build.py"'
  # conda writes a relocatable launcher; pip's Windows launcher keeps the build prefix.
  entry_points:  # [win]
    - smsd-mcp = smsd.mcp_server:main  # [win]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.18
    - ninja
  host:
    - python
    - pip
    - scikit-build-core >=0.5,<2
    - pybind11 >=2.12,<4
    - llvm-openmp  # [osx]
  run:
    - {{ pin_compatible('python', max_pin='x.x') }}

test:
  imports:
    - smsd
    - smsd.adapters
    - smsd.corpus
    - smsd.clustering
    - smsd.highlight
    - smsd.mcp_server
  files:  # [win]
    - check_launcher.py  # [win]
  requires:
    - pip
    - numpy >=1.24,<3
  commands:
    - python -m pip check
    - python check_launcher.py  # [win]

about:
  home: https://asad.github.io/SMSD/
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE
    - licenses/rdkit/LICENSE
    - licenses/pybind11/LICENSE
  summary: Chemical substructure search, SMARTS, MCS, molecular fingerprints and similarity screening
  description: |
    SMSD Pro provides substructure and SMARTS search, maximum common substructure (MCS) search, molecular fingerprints and similarity screening for chemical graphs.

    Use it for cheminformatics tasks such as finding molecular motifs, comparing common substructures and screening compound libraries. Search results include atom and bond mappings and explicit search status fields.

    Install: `conda install -c bioinception -c conda-forge smsd`

    - [Homepage](https://asad.github.io/SMSD/)
    - [User guide](https://asad.github.io/SMSD/guide/)
    - [Python examples](https://github.com/asad/SMSD/blob/master/python/README.md)
    - [Screening examples](https://github.com/asad/SMSD/blob/master/docs/EXAMPLES.md#screening)
  doc_url: https://asad.github.io/SMSD/guide/
  dev_url: https://github.com/asad/SMSD

extra:
  source_commit: "{{ smsd_source_commit }}"
  recipe-maintainers:
    - asad
